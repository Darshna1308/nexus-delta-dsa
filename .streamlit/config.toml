[theme]
base = "light"
primaryColor = "#2F6BFF"
backgroundColor = "#F5F3EE"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0E1A33"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
