<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS DELTA 3D</title>
<style>
@font-face{font-family:'IBM Plex Sans';src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:'IBM Plex Sans';src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:'IBM Plex Mono';src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2');font-weight:400}
html,body{margin:0;background:transparent;overflow:hidden;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#17212B}
#r{width:100%;height:420px}
.nofx{padding:14px;font-size:13px}.nofx table{border-collapse:collapse;width:100%}.nofx td,.nofx th{border-bottom:1px solid #DDD5C6;padding:5px 6px;text-align:left}
</style>
</head>
<body>
<div id="r"></div>
<script src="nd3d.js"></script>
<script>
// Minimal Streamlit component protocol (no npm runtime needed): componentReady -> render(args) -> setFrameHeight.
(function () {
  var started = false;
  function send(type, extra) { var m = { isStreamlitMessage: true, type: type }; for (var k in (extra || {})) m[k] = extra[k]; window.parent.postMessage(m, "*"); }
  window.addEventListener("message", function (ev) {
    var d = ev.data; if (!d || d.type !== "streamlit:render") return;
    var a = d.args || {}, root = document.getElementById("r"), h = a.height || 420;
    root.style.height = h + "px"; send("streamlit:setFrameHeight", { height: h });
    if (started) return; started = true;
    if (!window.ND3D) { root.innerHTML = '<div class="nofx">' + (a.fallback || "") + "</div>"; return; }
    var data = a.data || {}; if (data.svg) data.svg = "india.svg";
    try { window.ND3D[a.kind](root, data); } catch (e) { root.innerHTML = '<div class="nofx">' + (a.fallback || "") + "</div>"; }
  });
  send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
